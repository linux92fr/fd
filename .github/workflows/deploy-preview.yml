name: Deploy FO Free Distributions Preview

on:
  push:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: deploy-fd-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
