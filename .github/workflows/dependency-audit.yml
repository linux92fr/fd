name: Dependency security audit

on:
  push:
    branches:
      - preview
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate full and production audit reports
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-production.json || true

      - name: Display detailed vulnerability summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          for (const [label, file] of [
            ['ALL DEPENDENCIES', 'audit-full.json'],
            ['PRODUCTION DEPENDENCIES ONLY', 'audit-production.json']
          ]) {
            console.log('\\n========== ' + label + ' ==========');
            let report;
            try {
              report = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (error) {
              console.log('Unable to parse audit report:', error.message);
              continue;
            }

            console.log('Vulnerability totals:', JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
            const advisories = Object.values(report.vulnerabilities ?? {});
            if (!advisories.length) {
              console.log('No vulnerabilities reported.');
              continue;
            }

            for (const item of advisories) {
              console.log(JSON.stringify({
                package: item.name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                via: item.via,
                fixAvailable: item.fixAvailable,
                dependencyPaths: item.nodes
              }, null, 2));
            }
          }
          NODE

      - name: Upload raw audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            audit-full.json
            audit-production.json
          if-no-files-found: warn
          retention-days: 14
